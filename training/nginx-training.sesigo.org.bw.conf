server {
    listen 80;
    listen [::]:80;
    server_name training.sesigo.org.bw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name training.sesigo.org.bw;

    ssl_certificate /etc/letsencrypt/live/training.sesigo.org.bw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.sesigo.org.bw/privkey.pem;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:18100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:18100/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18100/static/;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:18100/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

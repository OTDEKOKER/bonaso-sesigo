name: ${TRAINING_PROJECT_NAME}

services:
  training-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRAINING_DB_NAME}
      POSTGRES_USER: ${TRAINING_DB_USER}
      POSTGRES_PASSWORD: ${TRAINING_DB_PASSWORD}
    volumes:
      - ./state/postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRAINING_DB_USER} -d ${TRAINING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - training-net

  training-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      training-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${TRAINING_DB_USER}:${TRAINING_DB_PASSWORD}@training-db:5432/${TRAINING_DB_NAME}
      SECRET_KEY: ${TRAINING_SECRET_KEY}
      DEBUG: ${TRAINING_DEBUG}
      DB_SSL_REQUIRE: "False"
      PORT: "18000"
      ALLOWED_HOSTS: ${TRAINING_ALLOWED_HOSTS}
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: ${TRAINING_CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${TRAINING_CSRF_TRUSTED_ORIGINS}
      USE_X_FORWARDED_PROTO: "True"
      SECURE_SSL_REDIRECT: "False"
      # Served only via the nginx TLS vhost (training.sesigo.org.bw); nginx
      # forwards X-Forwarded-Proto=https, so cookies must be marked secure.
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_HSTS_SECONDS: "0"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"
      BONASO_DJANGO_ROOT: "/app"
    volumes:
      - ./state/backend/uploads:/app/uploads
      - ./state/backend/media:/app/media
      - ./state/backend/staticfiles:/app/staticfiles
      - ../frontend/scripts:/app/workbook-imports:ro
    ports:
      - 127.0.0.1:${TRAINING_BACKEND_PORT}:18000
    networks:
      - training-net

  training-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_API_URL: http://training-backend:18000/api
    restart: unless-stopped
    depends_on:
      - training-backend
    environment:
      NODE_ENV: production
      PORT: 13000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_API_URL: http://training-backend:18000/api
      NEXT_PUBLIC_APP_URL: ${TRAINING_PUBLIC_BASE_URL}
    ports:
      - ${TRAINING_FRONTEND_BIND}:${TRAINING_FRONTEND_PORT}:13000
    networks:
      - training-net

networks:
  training-net:
    driver: bridge

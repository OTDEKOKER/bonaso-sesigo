name: CI

# Verifies the frontend builds (Next static export) and backend apps byte-compile,
# on GitHub-hosted runners — so build verification never runs on the memory-
# constrained production host. Does not deploy anything.

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend build (Next export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Mirrors the production Dockerfile build (same env args).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://sesigo.org.bw/api
          BACKEND_API_URL: https://sesigo.org.bw/api

  backend-syntax:
    name: Backend byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile backend apps
        run: python -m compileall -q backend/analysis backend/aggregates backend/projects backend/flags

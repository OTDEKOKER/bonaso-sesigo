# Content-Security-Policy (audit S1), defined once and shared by the backend
# (runtime env) and frontend (build arg — Next bakes headers() at build time).
# Rolled out in REPORT-ONLY mode: browsers report violations but never block, so
# this cannot break the app. Switch _REPORT_ONLY to "false" to enforce once the
# reports are clean.
x-csp-policy: &csp_policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'"
x-csp-report-only: &csp_report_only "true"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    # Cap memory so a runaway request/worker is OOM-killed inside the container
    # instead of starving the whole host (audit O3, 2026-06-22). 2g is well above
    # the normal ~340 MB footprint, so it only binds on a true runaway.
    mem_limit: 2g
    mem_reservation: 512m
    memswap_limit: 2560m
    environment:
      PORT: "18000"
      SECURE_SSL_REDIRECT: "True"
      USE_X_FORWARDED_PROTO: "True"
      BONASO_DJANGO_ROOT: "/app"
      # CSP for Django-served surfaces (admin, error pages). Report-only (S1).
      CONTENT_SECURITY_POLICY: *csp_policy
      CONTENT_SECURITY_POLICY_REPORT_ONLY: *csp_report_only
      # Access logging w/ request duration (%(D)s, microseconds) so slow endpoints
      # are visible before they hit the gunicorn --timeout and get SIGKILLed.
      # Gunicorn reads GUNICORN_CMD_ARGS automatically; no entrypoint/image change.
      # --max-requests recycles each worker after N requests (+jitter) to bound
      # gradual memory growth/leaks (audit O3).
      GUNICORN_CMD_ARGS: "--max-requests 800 --max-requests-jitter 100 --access-logfile - --access-logformat '%(h)s %(m)s %(U)s?%(q)s -> %(s)s %(D)sus %(b)sb'"
    # Liveness/readiness probe (audit WS3). Surfaces an up-but-broken backend
    # (e.g. Postgres unreachable) as "unhealthy" in `docker ps`. curl is present
    # in the image (installed for the PG apt key). Note: a healthcheck gives
    # visibility, not auto-restart — restart:unless-stopped still only recovers a
    # process that actually exits; pair with an autoheal sidecar for auto-restart.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18000/api/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Bound container log growth (audit WS3): 5 x 20 MB rotated JSON logs.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ../backend/.env:/app/.env:ro
      - ../backend/uploads:/app/uploads
      - ../backend/media:/app/media
      - ../backend/reports:/app/reports
      - ../backend/staticfiles:/app/staticfiles
      # Share the host's backup directory so the on-demand "Generate backup"
      # and download/restore endpoints operate on the SAME files the nightly
      # host cron writes (otherwise the container would see a stale baked copy).
      - ../backend/backups:/app/backups
      - ../frontend/scripts:/app/workbook-imports:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_API_URL: http://127.0.0.1:18000/api
        # CSP baked into the Next headers() manifest at build time (S1, report-only).
        CONTENT_SECURITY_POLICY: *csp_policy
        CONTENT_SECURITY_POLICY_REPORT_ONLY: *csp_report_only
    depends_on:
      - backend
    network_mode: host
    restart: unless-stopped
    # Cap memory (audit O3). Next.js SSR normally sits well under this.
    mem_limit: 1g
    mem_reservation: 256m
    memswap_limit: 1280m
    # Bind Next.js to loopback only. The host-networked container would
    # otherwise listen on 0.0.0.0:13000 and be reachable directly (bypassing
    # nginx/TLS). nginx proxies / to 127.0.0.1:13000, so loopback is sufficient.
    command: ["npm", "run", "start", "--", "--hostname", "127.0.0.1"]
    environment:
      NODE_ENV: production
      PORT: 13000
      HOSTNAME: 127.0.0.1
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_API_URL: http://127.0.0.1:18000/api
      NEXT_PUBLIC_APP_URL: https://sesigo.org.bw
    # Liveness probe (audit WS3). node:20 has global fetch; any HTTP response
    # means Next.js is serving (a network error means it is down).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:13000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# SESIGO edge security headers (audit WS3) — STAGED, NOT YET APPLIED.
# ---------------------------------------------------------------------------
# Add to the live edge by copying this file to
#   /etc/nginx/snippets/sesigo-security-headers.conf
# and adding, inside the `server { listen 443 ... }` block:
#   include /etc/nginx/snippets/sesigo-security-headers.conf;
#
# What/why:
#   * The Next.js app pages currently emit only `X-Content-Type-Options: nosniff`
#     and the (report-only) CSP; they do NOT carry Referrer-Policy,
#     Permissions-Policy, X-Frame-Options or HSTS at the edge. Django-served
#     routes (/api,/admin,/static,/media) already emit those via SecurityMiddleware.
#   * Setting them here with `always` covers ALL responses (including the app
#     pages and error responses). To avoid the SAME header appearing twice on the
#     Django-proxied routes, the proxied locations use `proxy_hide_header` to drop
#     the upstream copy so this one is authoritative (see the hardened site file).
#
# CSP is intentionally NOT set here — it is owned by the application (report-only
# roll-out, audit S1). Adding a second CSP at the edge would conflict.
#
# HSTS: safe here because sesigo.org.bw is fully served over valid TLS. Do NOT add
# `preload` until the domain is actually submitted to the HSTS preload list, and
# do NOT enable a `www` (or any other) hostname on HTTPS until its DNS + TLS SAN
# exist (see sesigo-www-redirect.conf).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

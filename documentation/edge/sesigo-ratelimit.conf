# SESIGO edge rate limiting (audit WS3) — STAGED, NOT YET APPLIED.
# ---------------------------------------------------------------------------
# This block MUST live in the `http { }` context (it declares a shared-memory
# zone), so install it as a conf.d file, NOT inside a server block:
#   sudo cp sesigo-ratelimit.conf /etc/nginx/conf.d/sesigo-ratelimit.conf
# Then reference the zone from the auth locations (see the hardened site file):
#   location = /api/users/request-token/ { limit_req zone=sesigo_auth burst=10 nodelay; ... }
#
# Why: defence-in-depth backstop against credential-stuffing / token floods. The
# Django app already throttles these (DRF ScopedRateThrottle: login 10/min,
# token_refresh 30/min, password_reset 5/h), so this edge limit is deliberately
# LOOSER than the app throttle — it only stops a flood from ever reaching the app,
# and must never be tighter than the app limit or it would mask/duplicate it and
# risk locking out legitimate bursts (e.g. a shared-NAT office).
#
# 30 requests/minute/IP with a burst of 10 is comfortably above any human login
# cadence. Tune `rate`/`burst` per traffic. `limit_req_status 429` returns a
# proper Too Many Requests rather than the nginx default 503.

limit_req_zone $binary_remote_addr zone=sesigo_auth:10m rate=30r/m;
limit_req_status 429;

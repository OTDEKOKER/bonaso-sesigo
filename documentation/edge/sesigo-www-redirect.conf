# www.sesigo.org.bw -> apex canonical 301 redirect
# ---------------------------------------------------------------------------
# STAGED 2026-07-15 — NOT YET APPLIED to the live edge.
# Append these two server blocks to /etc/nginx/sites-enabled/sesigo.org.bw
# (or drop this file into sites-enabled/) ONLY AFTER:
#   1. a `www` DNS record exists at the registrar (CNAME www -> sesigo.org.bw.,
#      or A www -> 38.51.241.67), and
#   2. the TLS cert has been expanded to cover www (see runbook below) — the
#      443 block presents the apex cert, so without the www SAN a browser
#      hitting https://www.sesigo.org.bw gets a cert-name-mismatch warning.
# The apex server blocks in the existing config are left untouched.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name www.sesigo.org.bw;
    return 301 https://sesigo.org.bw$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sesigo.org.bw;

    ssl_certificate     /etc/letsencrypt/live/sesigo.org.bw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sesigo.org.bw/privkey.pem;

    return 301 https://sesigo.org.bw$request_uri;
}

# SESIGO hardened nginx site config (audit WS3) — STAGED, NOT YET APPLIED.
# ===========================================================================
# This is the PROPOSED replacement for /etc/nginx/sites-available/sesigo.org.bw.
# It is a superset of the live config — every existing route is preserved byte-
# for-byte in behaviour; the additions are: security headers, auth rate limiting,
# explicit proxy timeouts, and duplicate-header suppression on the Django routes.
#
# It does NOT enable www (that stays gated on DNS + TLS SAN — see
# sesigo-www-redirect.conf) and does NOT change any proxy_pass target or port.
#
# Apply/verify/rollback: see documentation/SESIGO_INFRA_SECURITY_HARDENING_RUNBOOK.md.
# Prerequisites for this file:
#   /etc/nginx/snippets/sesigo-security-headers.conf   (from sesigo-security-headers.conf)
#   /etc/nginx/conf.d/sesigo-ratelimit.conf            (from sesigo-ratelimit.conf)
# ===========================================================================

# ---- HTTP -> HTTPS (unchanged) --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sesigo.org.bw;
    return 301 https://$host$request_uri;
}

# ---- HTTPS apex ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sesigo.org.bw;

    ssl_certificate /etc/letsencrypt/live/sesigo.org.bw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sesigo.org.bw/privkey.pem;

    # Matches the app upload cap (workbook uploads). Unchanged.
    client_max_body_size 50M;

    # Security headers on every response (incl. the Next.js app pages + errors).
    include /etc/nginx/snippets/sesigo-security-headers.conf;

    # Sensible proxy timeouts. Workbook import/export are async (ExportJob /
    # process_import_job), so no sync request should be long-running; 120s read is
    # generous headroom for SSR + any heavy funder-report render.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ---- Django API --------------------------------------------------------
    location /api/ {
        # Django's SecurityMiddleware already sets these; drop the upstream copy
        # so the edge header (above) is the single authoritative one.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;

        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Auth endpoints: edge rate-limit backstop --------------------------
    # Looser than the app throttle (login 10/min); only stops floods. Exact-match
    # locations so ONLY the sensitive endpoints are limited, nothing else.
    location = /api/users/request-token/ {
        limit_req zone=sesigo_auth burst=10 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://127.0.0.1:18000/api/users/request-token/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/users/token/refresh/ {
        limit_req zone=sesigo_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:18000/api/users/token/refresh/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Django admin ------------------------------------------------------
    location /admin/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://127.0.0.1:18000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Static / media (served by Django/WhiteNoise) ----------------------
    location /static/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:18000/static/;
    }
    location /media/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:18000/media/;
    }

    # ---- Next.js app (SSR) -------------------------------------------------
    location / {
        # Next already sets nosniff; drop it so the edge copy is authoritative.
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Version-controlled copy of the production nginx site for sesigo.org.bw.
# Deployed path: /etc/nginx/sites-available/sesigo.org.bw (symlinked in sites-enabled).
# Apply with: deploy/nginx/apply-security-headers.sh  (needs sudo).
#
# Assessment 2026-07-31 hardening: added HSTS + X-Frame-Options (were absent on
# the frontend surface). Keep this file in sync with the live config.
server {
    listen 80;
    listen [::]:80;
    server_name sesigo.org.bw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sesigo.org.bw;

    ssl_certificate /etc/letsencrypt/live/sesigo.org.bw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sesigo.org.bw/privkey.pem;

    client_max_body_size 50M;

    # Security headers (assessment 2026-07-31). Server-level so they apply to the
    # Next.js frontend (which did not emit them) and the proxied Django surface.
    # - HSTS mirrors the Django SECURE_HSTS_* settings (1y + subdomains + preload).
    # - X-Frame-Options DENY blocks clickjacking of the SESIGO app. It does NOT
    #   affect /cso-mapping embedding KoboToolbox (that is outbound frame-src, not
    #   framing of SESIGO itself).
    # NOTE: nginx add_header does not inherit into a location that sets its own
    # add_header — if you add per-location headers later, re-declare these there.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:18000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18000/static/;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:18000/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
